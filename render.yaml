databases:
  - name: whisper-db
    plan: free
    databaseName: whisper
services:
  - type: web
    name: whisper
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:setup
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whisper-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
